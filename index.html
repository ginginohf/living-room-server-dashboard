<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Server dashboard</title><style>body{background:#101826;color:#e8eef8;font:24px system-ui;margin:5vw}h1{font-size:44px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}.card{background:#1c293d;border-radius:20px;padding:24px}strong{display:block;font-size:44px}input,button{font:inherit;padding:10px}#error{color:#ffc680}</style><h1>Сервер</h1><form id="login"><input id="token" type="password" placeholder="Токен панели" required autocomplete="off"><button>Подключиться</button></form><p id="error"></p><main class="grid" id="cards"></main><script>
let auth='';const cards=document.querySelector('#cards'),error=document.querySelector('#error');function card(title,value){const d=document.createElement('div');d.className='card';d.textContent=title;const n=document.createElement('strong');n.textContent=value;d.append(n);cards.append(d)}async function update(){if(!auth)return;try{const r=await fetch('/metrics',{headers:{Authorization:'Bearer '+auth},cache:'no-store'});if(!r.ok)throw Error('Метрики пока недоступны или неверный токен');const m=await r.json();cards.replaceChildren();card('CPU',m.cpu.toFixed(1)+'%');card('RAM',(100*m.memory_used/m.memory_total).toFixed(1)+'%');card('Температура',m.temperature===null?'—':m.temperature+' °C');card('Входящий трафик',(m.rx/1048576).toFixed(2)+' MiB/s');for(const d of m.disks)card(d.label,d.mounted?(d.free/1073741824).toFixed(1)+' GiB свободно':'не подключён');error.textContent=''}catch(e){error.textContent=e.message}}document.querySelector('#login').onsubmit=e=>{e.preventDefault();auth=document.querySelector('#token').value;document.querySelector('#token').value='';update()};setInterval(update,5000);
</script></html>
